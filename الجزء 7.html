    <h3>
        الجزء 7
    </h3>
  <h2>
    اجتمع الأخوة الثلاثة حول المكيف تحت إشراف الأب حمادي.
     صعد مهاب على الكرسي بحذر، وفتح الغطاء الخارجي ليتفقد الفلاتر، 
     بينما كان مجد يقرأ له التعليمات، ومهران يناوله الأدوات بسرعة فائقة.
      تبيّن أن الغبار المتراكم بسبب الرياح الصيفية سدّ منافذ الهواء تماماً.
  </h2>
