 <h3> الجزء 3  <h3>
<h2>
    أقبلت الأم الغالية لطيفة بن تيشة وهي تحرك مروحة يدوية من الكرتون لتخفف وطأة الحر عن وجهها،
     وقالت بصوت متعب ولكن حنون:
     "يا أبو مهاب، هذا المكيف لا يبرد بتاتاً!
     الغرفة أصبحت كالحمام المغربي، 
     والملابس تلتصق بأجسادنا من شدة العرق".
</h2>
