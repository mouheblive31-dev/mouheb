    <h3>
        الجزء 8
    </h3>
    <h2>
    أخذوا الفلاتر وقاموا بغسلها معاً بماء بارد،
     وأعادوها إلى مكانها. وعندما ضغط الأب حمادي على زر التشغيل مجدداً..
     بدأت النسمات الباردة تتدفق تدريجياً لتعيد الروح والبهجة إلى البيت. 
    تنهدت الأم لطيفة براحة قائلة: 
    "الحمد لله، يعطيكم الصحة يا أولادي".
